services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: cloudwave
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cloudwave
    ports:
      - "5432:5432"

  minio:
    image: minio/minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"

  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set cloudwave http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb cloudwave/music;
      /usr/bin/mc policy set public cloudwave/music;
      exit 0;
      "
